name: CI

# Replica los gates reales de .husky/pre-commit en un runner limpio, mas el build
# y publicacion del APK Android cuando se etiqueta una version. Ver
# openspec/changes/archive/ para el diseno completo (busqueda: ci-cd-pipeline).
#
# Monorepo (entorno-api-docker): la app movil vive en apps/mobile/, por eso los
# pasos especificos de TS/Rust/Tauri llevan working-directory: apps/mobile[...].
# pnpm install sigue en la raiz del repo -- un unico lockfile de workspace cubre
# tanto el package.json raiz (solo scripts docs:*) como apps/mobile.

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

# Cancela runs en curso solo en PRs (nunca en push a master ni en tags de
# release) -- push a varios commits seguidos a la misma PR (como ha pasado
# hoy con los reintentos manuales) dejaba corriendo hasta el final runs ya
# obsoletos en vez de cancelarlos.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality-ts:
    name: Quality gates — TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # El binario de Cypress (~100+MB) se descarga en un postinstall script,
      # fuera del store de pnpm que ya cachea `actions/setup-node` -- sin esto
      # se re-descarga entero en cada run aunque la versión no cambie.
      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            cypress-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Documentation coverage
        run: pnpm run docs:coverage

      - name: Typecheck (tsc)
        working-directory: apps/mobile
        run: pnpm exec tsc --noEmit

      - name: ESLint
        working-directory: apps/mobile
        run: pnpm exec eslint src/ --max-warnings 0

      - name: Unit tests (Vitest, with coverage)
        working-directory: apps/mobile
        run: pnpm exec vitest run --coverage

      # catalogo-tipos-parada (grupo 8.2): cockpit-mark-stop.cy.ts ejercita la
      # integración real apps/mobile -> apps/api (catálogo de tipos de parada),
      # sin mocks -- necesita el backend real arriba, igual que en local. Valores
      # de .env.example (triviales, solo desarrollo) válidos también aquí: el
      # runner es efímero y no expone el puerto a nada externo.
      - name: Start apps/api (real backend for Cypress E2E)
        working-directory: infra/docker
        run: |
          cp .env.example .env
          docker compose up -d --build
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/stop-types > /dev/null; then
              echo "apps/api listo"
              exit 0
            fi
            sleep 2
          done
          echo "apps/api no respondió a tiempo" >&2
          docker compose logs
          exit 1

      - name: E2E tests (Cypress)
        working-directory: apps/mobile
        run: pnpm run test:e2e

      - name: Stop apps/api
        if: always()
        working-directory: infra/docker
        run: docker compose down -v

  quality-tauri:
    name: Quality gates — Tauri (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/mobile/src-tauri

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo fmt --check
        working-directory: apps/mobile/src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: apps/mobile/src-tauri
        run: cargo clippy -- -D warnings

      - name: cargo test
        working-directory: apps/mobile/src-tauri
        run: cargo test

      # Mismas excepciones documentadas que .husky/pre-commit — deben mantenerse
      # en sincronía. RUSTSEC-2023-0071 (rsa/Marvin Attack, sin fix disponible, vía
      # sqlx-mysql transitivo de tauri-plugin-sql — MySQL nunca se usa en runtime).
      # RUSTSEC-2026-0235 (rkyv, out-of-bounds read, vía el feature opcional "rkyv"
      # de rust_decimal, mismo árbol que RUSTSEC-2023-0071 — este proyecto solo
      # activa "default"/"serde"/"std" de rust_decimal, el feature vulnerable nunca
      # se compila; confirmado con `cargo tree -e features -i rust_decimal --target all`).
      - name: cargo audit
        working-directory: apps/mobile/src-tauri
        run: cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0235

  quality-go:
    name: Quality gates — Go (apps/api)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-trixie
        env:
          POSTGRES_DB: motoroutes
          POSTGRES_USER: motoroutes
          POSTGRES_PASSWORD: motoroutes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U motoroutes -d motoroutes"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: apps/api/go.sum

      - name: gofmt --check
        working-directory: apps/api
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: go vet
        working-directory: apps/api
        run: go vet ./...

      - name: go build
        working-directory: apps/api
        run: go build ./...

      # MinIO no puede ser un `services:` declarativo como postgres: la imagen
      # oficial minio/minio exige el argumento de comando `server /data` (sin
      # él solo imprime el uso y termina), y el bloque `services:` de GitHub
      # Actions no admite pasar argumentos de comando al contenedor — solo
      # image/env/ports/options. Se levanta con `docker run` manual y se
      # espera contra su endpoint de salud desde el propio runner (ver
      # design.md D6 de almacenamiento-fotos-backend).
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=motoroutes \
            -e MINIO_ROOT_PASSWORD=motoroutes123 \
            minio/minio server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 1
          done
          echo "MinIO did not become healthy in time" >&2
          exit 1

      - name: go test
        working-directory: apps/api
        env:
          DATABASE_URL: postgres://motoroutes:motoroutes@localhost:5432/motoroutes
          MINIO_ENDPOINT: localhost:9000
          MINIO_ACCESS_KEY: motoroutes
          MINIO_SECRET_KEY: motoroutes123
        run: go test ./...

      # go install ...@latest se reinstalaba desde cero en cada run -- el caché
      # de setup-go cubre GOMODCACHE/GOCACHE pero no GOBIN. Cachear el binario
      # es seguro: la base de datos de vulnerabilidades la descarga govulncheck
      # en tiempo de ejecución, no viaja embebida en el binario instalado.
      - name: Cache govulncheck binary
        uses: actions/cache@v4
        with:
          path: ~/go/bin/govulncheck
          key: govulncheck-${{ runner.os }}

      - name: govulncheck
        working-directory: apps/api
        run: |
          if [ ! -x ~/go/bin/govulncheck ]; then
            go install golang.org/x/vuln/cmd/govulncheck@latest
          fi
          ~/go/bin/govulncheck ./...

  build-and-release:
    name: Build & release Android APK
    needs: [quality-ts, quality-tauri, quality-go]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # El GITHUB_TOKEN automatico solo tiene contents: read por defecto -- sin esto,
    # softprops/action-gh-release falla con 403 "Resource not accessible by
    # integration" al intentar crear el Release. Acotado a este job (no a todo el
    # workflow), coherente con el principio de permisos minimos de ADR-014.
    permissions:
      contents: write
    env:
      ANDROID_NDK_VERSION: 29.0.13846066
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/mobile/src-tauri

      # ${{ env.X }} en un campo estructurado (path:, key:) solo ve variables
      # declaradas en un bloque `env:` del workflow, nunca variables de entorno
      # del runner en tiempo de ejecucion (esas solo existen dentro de `run:`
      # como $ANDROID_HOME) - hay que promocionarla explicitamente via GITHUB_ENV
      # antes de poder usarla como expresion en el paso de cache siguiente.
      - name: Resolve ANDROID_HOME
        run: |
          if [ -z "$ANDROID_HOME" ]; then
            echo "ANDROID_HOME not set by the runner" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Cache Android SDK/NDK components
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/ndk
            ${{ env.ANDROID_HOME }}/platforms
            ${{ env.ANDROID_HOME }}/build-tools
          key: android-sdk-ndk${{ env.ANDROID_NDK_VERSION }}-platform36-buildtools36

      - name: Locate Android cmdline-tools (not on PATH by default on ubuntu-latest)
        run: |
          SDKMANAGER_BIN=$(find "$ANDROID_HOME" -maxdepth 4 -name sdkmanager -type f | head -n1)
          if [ -z "$SDKMANAGER_BIN" ]; then
            echo "sdkmanager not found under ANDROID_HOME=$ANDROID_HOME" >&2
            exit 1
          fi
          dirname "$SDKMANAGER_BIN" >> "$GITHUB_PATH"

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "ndk;${{ env.ANDROID_NDK_VERSION }}" "build-tools;36.0.0"

      - name: Configure Android NDK linker (overrides apps/mobile/src-tauri/.cargo/config.toml, that one is Windows-only for local dev)
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ADR-035 (catalogo-tipos-parada): el host real de apps/api (interfaz Tailscale
      # del servidor) nunca vive en un fichero versionado -- este repo es publico.
      # Aqui se inyecta solo en tiempo de ejecucion del runner (nunca escrito de vuelta
      # al repo, el checkout es efimero) a partir de un GitHub Secret.
      #
      # Dos sitios distintos, ambos necesarios -- no es solo VITE_API_BASE_URL:
      # 1. VITE_API_BASE_URL (leido por getApiBaseUrl(), horneado en el bundle JS por Vite).
      # 2. El CSP `connect-src` de apps/mobile/index.html: Tauri NO reescribe la etiqueta
      #    <meta> de CSP del index.html empaquetado en Android a partir de
      #    tauri.conf.json/--config (confirmado durante la verificacion en dispositivo
      #    real de catalogo-tipos-parada, grupo 8.3 -- ver ADR-035 punto 7) -- sin este
      #    parche, el WebView bloquea el fetch aunque la URL este bien horneada.
      # Falla explicitamente si el secret no esta configurado, en vez de publicar en
      # silencio una release que solo sabe hablar con localhost (inutil en un movil real).
      - name: Configure production apps/api host (release only, never committed)
        env:
          PROD_API_BASE_URL: ${{ secrets.MOBILE_PROD_API_BASE_URL }}
        run: |
          if [ -z "$PROD_API_BASE_URL" ]; then
            echo "El secret MOBILE_PROD_API_BASE_URL no esta configurado -- sin el, la release apuntaria a localhost (inutil en un movil real). Configuralo en Settings > Secrets and variables > Actions." >&2
            exit 1
          fi
          echo "VITE_API_BASE_URL=$PROD_API_BASE_URL" >> "$GITHUB_ENV"
          sed -i "s|http://localhost:8080|http://localhost:8080 ${PROD_API_BASE_URL}|" apps/mobile/index.html
          sed -i "s|http://localhost:8080|http://localhost:8080 ${PROD_API_BASE_URL}|" apps/mobile/src-tauri/tauri.conf.json

      - name: Build APK (Tauri CLI — never a manual cargo build, see memory/context.md)
        working-directory: apps/mobile
        run: pnpm tauri android build --target aarch64 --debug

      # Gotcha documentado en memory/context.md (2026-08-02): `pnpm tauri android build`
      # a veces no vuelve a copiar el `dist/` recien generado dentro de
      # gen/android/app/src/main/assets -- el APK resultante empaqueta el bundle JS
      # de una build anterior sin ningun error ni warning. El paso de verificacion
      # siguiente lo detecta pero no lo arregla, asi que aqui forzamos la sincronizacion
      # de los assets y reempaquetamos SOLO con Gradle (las librerias Rust ya estan
      # compiladas por el paso anterior, no hace falta recompilarlas).
      - name: Force-sync fresh frontend assets into the Android project
        working-directory: apps/mobile
        run: |
          ASSETS_DIR=src-tauri/gen/android/app/src/main/assets
          rm -rf "$ASSETS_DIR/assets"
          cp -r dist/assets "$ASSETS_DIR/assets"
          cp dist/index.html "$ASSETS_DIR/index.html"
          cd src-tauri/gen/android
          ./gradlew assembleUniversalDebug \
            -x :app:rustBuildUniversalDebug \
            -x :app:rustBuildArm64Debug \
            -x :app:rustBuildArmDebug \
            -x :app:rustBuildX86Debug \
            -x :app:rustBuildX86_64Debug

      - name: Verify the APK bundles the freshly built frontend and the real apps/api host
        run: |
          APK=apps/mobile/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          EXPECTED=$(grep -o 'index-[A-Za-z0-9_]*\.js' apps/mobile/dist/index.html)
          PACKAGED_HTML=$(unzip -p "$APK" assets/index.html)
          ACTUAL=$(echo "$PACKAGED_HTML" | grep -o 'index-[A-Za-z0-9_]*\.js')
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "El APK empaqueta un frontend desactualizado (tiene $ACTUAL, se esperaba $EXPECTED)"
            exit 1
          fi
          if ! echo "$PACKAGED_HTML" | grep -qF "$PROD_API_BASE_URL"; then
            echo "El CSP del APK empaquetado no incluye el host real de apps/api ($PROD_API_BASE_URL) -- la app no podra alcanzarlo en un movil real"
            exit 1
          fi
        env:
          PROD_API_BASE_URL: ${{ secrets.MOBILE_PROD_API_BASE_URL }}

      - name: Rename APK with the release tag
        run: |
          mkdir -p release
          cp apps/mobile/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk "release/moto-routes-${GITHUB_REF_NAME}-arm64-debug.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.apk
          body: |
            APK de depuración (sin firma de release) — instalar con `adb install -r`.
            Cada release usa un keystore de debug distinto generado en el runner: si
            la instalación falla por incompatibilidad de firma sobre una versión
            anterior, desinstala primero (`adb uninstall com.motoroutes.app`).
